services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AUTH_DB: ${AUTH_DB}
      USERS_DB: ${USERS_DB}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-migration:
    image: migrate/migrate:4
    container_name: postgres_migration
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8.8.3
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: postgres_port_forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

  redis-port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: redis_port_forwarder
    command: tcp-listen:6379,fork,reuseaddr tcp-connect:redis:6379
    ports:
      - "127.0.0.1:6379:6379"
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
